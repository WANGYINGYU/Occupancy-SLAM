# ROS1/ROS2 bag input. CLI options override these values.
# Paths in this YAML are relative to this file; --bag on the CLI uses your shell directory.
# bag: /absolute/path/input.bag
scan_topic: auto             # Set e.g. /robot/front/scan when the bag has several sensors.
odom_source: auto            # auto | tf | odom | scan-match
odom_topic: /odom
tf_topic: /tf
tf_static_topic: /tf_static
odom_frame: odom             # TF frame name, not a topic.
projection_frame: null      # null: original scan frame; e.g. base_link requires TF extrinsics.
tf_max_gap: 0.2
min_range: 0.1
max_range: 30.0
beam_stride: 1
scan_stride: 1
start: 0
max_scans: 0
resolution: 0.15             # C++ optimization grid; viewer --display-resolution is independent.
iterations: 10
odom_weight: 0.1
slam_config: ../slam_toolbox.yaml
scan_timeout: 3.0
startup_timeout: 30.0
min_accepted_fraction: 0.8
domain_id: 87
output: pipeline             # Relative to the new experiment directory.

backend_config: ../backend/bag.txt
frontend_resolution: null # null preserves the slam_toolbox YAML resolution
step_policy: legacy       # paper update; optional decrease checks frozen-N cost
max_observations: 20000000
display_resolution: 0.05
